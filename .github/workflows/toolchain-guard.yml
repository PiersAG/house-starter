name: Toolchain guard (reusable)

on:
  workflow_call: {}

jobs:
  toolchain-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout caller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # #750: the script is read at the same release tag callers pin this
      # workflow to (toolchain-guard-v1), never house-starter's moving main, so
      # a change to the guard reaches callers only when the tag is moved.
      - name: Fetch canonical guard script (house-starter, public)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: PiersAG/house-starter
          ref: toolchain-guard-v1
          path: _toolchain
      - name: Run toolchain guard against this repo only
        run: |
          cp _toolchain/scripts/check-toolchain.py "$RUNNER_TEMP/check-toolchain.py"
          rm -rf _toolchain
          python3 "$RUNNER_TEMP/check-toolchain.py"
