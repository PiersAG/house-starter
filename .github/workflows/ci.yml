name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  toolchain-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HARD.06 G2 toolchain divergence guard
        run: python3 scripts/check-toolchain.py
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      # HARD.06 item 9: the build sandbox ran the tsx loader on its own container
      # Node with no Node-24 equivalent anywhere in CI. This is that equivalent —
      # if tsx's loader ever breaks on the pinned Node major, it breaks here.
      - name: tsx runs on Node 24 (loader smoke)
        run: npx tsx --version
      # DB-DRIVER LOCK: this template's database driver is libSQL (@libsql/client +
      # drizzle-orm/libsql), by design — same driver across dev/test/staging/prod,
      # differing only by DATABASE_URL, and deployable to serverless. The build
      # agent must not swap it back to better-sqlite3 (file-on-local-disk; cannot
      # run on serverless). A swap that passes other gates is still a contract
      # violation.
      - name: Database driver lock (libSQL only)
        run: |
          set -e
          # 1. @libsql/client MUST be a declared dependency.
          if ! grep -qE '"@libsql/client"' package.json; then
            echo "::error::DB-driver lock: @libsql/client missing from package.json. This template uses libSQL for dev/prod parity and serverless deployability."
            exit 1
          fi
          # 2. better-sqlite3 MUST NOT reappear (file-on-local-disk; cannot run on serverless).
          if grep -qiE '"better-sqlite3"|"@types/better-sqlite3"' package.json; then
            echo "::error::DB-driver lock: better-sqlite3 found in package.json. It cannot run on serverless (no persistent local disk). Use libSQL."
            exit 1
          fi
          # 3. No better-sqlite3 imported anywhere in source.
          if grep -rniE "from ['\"]better-sqlite3|require\(['\"]better-sqlite3|drizzle-orm/better-sqlite3" \
                --include="*.ts" --include="*.tsx" \
                . 2>/dev/null | grep -v node_modules; then
            echo "::error::DB-driver lock: better-sqlite3 imported in source. Use libSQL (@libsql/client + drizzle-orm/libsql)."
            exit 1
          fi
          echo "DB-driver lock OK: libSQL is the sole database driver."

      # Fail-closed billing-price guard (root fix for the stub-price checkout
      # 500; K9Coach /reactivate, 2026-07-22). config/billing.ts ships the stub
      # "price_stub_replace_me" in this TEMPLATE deliberately — its CI never
      # talks to Stripe. But that stub must never survive into a generated app:
      # /api/billing/checkout hands priceIds.default straight to Stripe, and the
      # stub makes every Subscribe click 500 ("No such price"). Commissioning now
      # creates a real price at scaffold (provision_stripe_price.py); this is the
      # CI backstop. Mode is chosen by repo identity so one ci.yml serves both:
      # the template asserts the stub is still present (no real id can be
      # hardcoded into it), every generated app fails-closed unless it carries a
      # real price_… id.
      - name: Billing price configured (fail-closed; template keeps the stub)
        run: |
          if [ "${{ github.repository }}" = "PiersAG/house-starter" ]; then
            node scripts/check-billing-configured.mjs --expect-stub
          else
            node scripts/check-billing-configured.mjs
          fi

      # Fail fast: lint runs first, blocks type-check and tests if it fails.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # Coverage truth (spec C4b): NO blanket global threshold — the report is
      # informational and honest. The SECURITY GATE is per-file 100% coverage
      # on lib/password.ts, lib/rate-limit.ts, lib/users.ts and lib/db.ts,
      # declared in vitest.config.ts and enforced right here, where coverage
      # is actually computed. This step FAILS if any of those files loses
      # coverage.
      - name: Unit tests + per-file 100% security coverage gate
        run: npm run test:coverage

      # Tamper check for the gate above. Enforcement lives in the coverage run
      # (single source of truth — deliberately no duplicate coverage logic
      # here); this step pins the contract so the per-file 100% thresholds
      # cannot be silently deleted, renamed, or lowered. It names REAL FILES
      # BY PATH — no directory-name pattern matching.
      - name: Security gate contract check (per-file 100% thresholds present)
        run: |
          node -e '
            const { readFileSync, existsSync } = require("fs");
            const cfg = readFileSync("vitest.config.ts", "utf8");
            const files = ["lib/password.ts", "lib/rate-limit.ts", "lib/auth-rate-limit.ts", "lib/app-url.ts", "lib/authz.ts", "lib/settings/operator.ts", "lib/users.ts", "lib/db.ts"];
            const metrics = ["lines", "statements", "branches", "functions"];
            let failed = false;
            for (const f of files) {
              if (!existsSync(f)) {
                console.error(`::error::Security gate contract: ${f} is missing from the repo.`);
                failed = true;
                continue;
              }
              const start = cfg.indexOf(`"**/${f}": {`);
              if (start === -1) {
                console.error(`::error::Security gate contract: vitest.config.ts no longer declares a per-file threshold block for ${f}.`);
                failed = true;
                continue;
              }
              const block = cfg.slice(start, cfg.indexOf("}", start) + 1);
              const missing = metrics.filter((m) => !block.includes(`${m}: 100`));
              if (missing.length > 0) {
                console.error(`::error::Security gate contract: ${f} thresholds not pinned at 100 for: ${missing.join(", ")}.`);
                failed = true;
              } else {
                console.log(`${f}: per-file 100% thresholds declared`);
              }
            }
            process.exit(failed ? 1 : 0);
          '

      # Billing grace-window acceptance (billing-gap-fill-spec §3 item 4): a REAL
      # Stripe test clock advanced past the failed-payment grace boundary. The
      # suite self-skips unless STRIPE_TEST_SECRET_KEY holds a real test-mode key
      # (the CI dummy is rejected), so this step is green with or without the
      # secret — and actually exercises the clock once the secret is provided.
      - name: Billing grace test-clock (real Stripe test key only; auto-skips without one)
        run: npm run test:integration
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}

      # E2E env (spec C4b, Deliverable D). CI-ONLY THROWAWAY VALUES — none of
      # these are real secrets and none reach any real system. The app fails
      # loudly at startup without a session secret and a database URL (by
      # design, no insecure defaults), so CI must provide explicit values for
      # the full chain to run. instrumentation.ts additionally validates the
      # running env against .env.contract at boot, so CI must supply every
      # deploy-injected contract var (DATABASE_AUTH_TOKEN is not required here
      # because DATABASE_URL is a local file: URL — the boot validator only
      # requires a token for a remote database).
      - name: Playwright smoke test
        env:
          # Dummy JWT-signing secret for this CI browser session only.
          AUTH_SECRET: ci-e2e-only-dummy-secret-not-used-anywhere-real
          # Local SQLite file (the scaffold's dev fallback), created on the
          # runner and discarded with it.
          #
          # PER-TENANT, which is the factory default (ADR-023) and therefore the
          # mode this suite has to run in: the smoke suite drives sign-up and
          # sign-in, and in per-tenant mode those go through the whole routing
          # seam — authenticate against the catalog, provision the new account's
          # own database, carry the tenant on the session. This step used to run
          # `shared` because the template could not sign anyone in per-tenant;
          # that is the gap the seam closed, and running the default here is what
          # stops it reopening. DATABASE_URL is the catalog; tenant databases are
          # provisioned as files under .build/tenants (no VERCEL_ENV on the
          # runner, so lib/tenant/provisioner.ts selects the file adapter).
          TENANCY_MODE: per_tenant
          DATABASE_URL: file:ci-e2e.db
          # Explicit safe-environment flag (ADR-015): in-memory rate limiting
          # is acceptable only here, where nothing real is reachable.
          RATE_LIMIT_ALLOW_IN_MEMORY: "true"
          # Declared deploy-injected in .env.contract → the boot validator
          # requires them. Throwaway/non-gating values for CI only:
          #   • STRIPE_SECRET_KEY: unused by the template today; a dummy string.
          #   • APP_LIFECYCLE_STATE: LAUNCHED ("live-quiet: any authenticated
          #     user passes", lib/live-eval.ts). LIVE_EVAL — the effective
          #     default for an unset value — is fail-closed on an empty
          #     allowlist, so any signed-in page a downstream app's e2e suite
          #     drives is 403'd with reason "live-eval-empty-allowlist". CI
          #     never sets an allowlist. LAUNCHED is the same posture the
          #     layout-gate step below already runs at, for the same reason.
          STRIPE_SECRET_KEY: sk_test_ci-e2e-only-dummy-not-a-real-key
          # STRIPE_WEBHOOK_SECRET: declared deploy-injected in .env.contract →
          # the boot validator requires it. Unused by the smoke suite (no real
          # webhook is delivered); a dummy string satisfies the presence check.
          STRIPE_WEBHOOK_SECRET: whsec_ci-e2e-only-dummy-not-a-real-secret
          APP_LIFECYCLE_STATE: LAUNCHED
          # EMAIL_PROVIDER_API_KEY (secret) + EMAIL_SEND_MODE (fixed) are
          # declared deploy-injected in .env.contract → the boot validator
          # requires them. EMAIL_SEND_MODE=log means no real mail is ever sent
          # in CI; the key is a dummy the log path never uses. (EMAIL_FROM is
          # source=app, not deploy-injected, so the boot validator skips it.)
          EMAIL_PROVIDER_API_KEY: re_ci-e2e-only-dummy-not-a-real-key
          EMAIL_SEND_MODE: log
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      # LAYOUT REGRESSION GUARDRAIL (card 2.3.51) — BLOCKING.
      #
      # Locks in the layout run (container queries 2.3.15, responsive nav
      # 2.3.49, responsive data table 2.3.50) so a later feature cannot
      # reintroduce horizontal overflow or silently reshape a page. Two checks
      # per page per width: the document must not scroll sideways (the hard
      # gate, no baseline needed) and the page must still match its committed
      # screenshot. Full rationale: docs/layout-guardrail.md.
      #
      # A SEPARATE STEP FROM THE SMOKE ABOVE, because it owns its own database
      # and its own baseline-vs-diff artefact upload. It stays on `shared`
      # deliberately: this is a pixel gate, tenancy changes nothing it looks at,
      # and re-pointing it would risk baseline churn for no added coverage. Both steps now run at
      # APP_LIFECYCLE_STATE=LAUNCHED — "live-quiet: any authenticated user
      # passes" (lib/live-eval.ts) — which is the correct lifecycle for any
      # check that drives the signed-in surfaces.
      #
      # THIS STEP FAILS ON A MISSING BASELINE, which is correct and is the
      # first thing a new branch sees. Baselines are generated in CI, never
      # locally — Playwright 1.60 installs no browser on the dev machine, and a
      # baseline rendered on different fonts mismatches every run. Generate or
      # refresh them by running the "Layout baselines" workflow against the
      # branch (.github/workflows/layout-baselines.yml).
      - name: Layout regression guardrail (overflow + visual baselines)
        env:
          AUTH_SECRET: ci-e2e-only-dummy-secret-not-used-anywhere-real
          TENANCY_MODE: shared
          DATABASE_URL: file:ci-layout.db
          RATE_LIMIT_ALLOW_IN_MEMORY: "true"
          STRIPE_SECRET_KEY: sk_test_ci-e2e-only-dummy-not-a-real-key
          STRIPE_WEBHOOK_SECRET: whsec_ci-e2e-only-dummy-not-a-real-secret
          # See the block comment above — LAUNCHED, not LIVE_EVAL.
          APP_LIFECYCLE_STATE: LAUNCHED
          EMAIL_PROVIDER_API_KEY: re_ci-e2e-only-dummy-not-a-real-key
          EMAIL_SEND_MODE: log
        run: |
          npx playwright install chromium
          npm run test:layout

      # The screenshots the step above compared against, and the diffs it
      # produced when they did not match. Without this, a baseline failure is a
      # percentage in a log with no way to see WHAT moved.
      - name: Upload layout guardrail report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-guardrail-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # TENANT ISOLATION — HTTP CROSS-TENANT ATTACK (SEC.47). BLOCKING.
      #
      # `npm run test:isolation` has two legs: a vitest resolver check and the
      # Playwright suite in tests/isolation/per-tenant.spec.ts, which signs in as
      # tenant A and tries to reach tenant B's rows over HTTP from six
      # directions — including a real cross-tenant WRITE (SEC.41). Nothing in CI
      # ran that Playwright leg, so the one gate that actually mounts the attack
      # was absent from every run.
      #
      # A SEPARATE STEP, for the same reason the layout gate is: it owns its own
      # databases, and Playwright's webServer has reuseExistingServer=false under
      # CI, so it cannot piggyback on the smoke step's server.
      #
      # ONE STEP, TWO BEHAVIOURS, chosen by repo identity — the same idiom as the
      # billing-price gate above. The two tenant database URLs are blank on the
      # template, which is exactly the condition the spec's own skip guard reads
      # (per-tenant.spec.ts:74-77): house-starter provisions no tenants, so the
      # step runs and self-skips green. On any generated app both URLs are set,
      # the spec provisions and migrates both databases itself, and the real
      # attack fires. Env is set explicitly here rather than left to
      # playwright.config.ts fallbacks, because those fallbacks diverge between
      # the template and generated apps — explicit env is what lets one identical
      # step behave correctly on both.
      - name: Tenant isolation — HTTP cross-tenant attack
        if: always()
        env:
          AUTH_SECRET: ci-e2e-only-dummy-secret-not-used-anywhere-real
          # per_tenant is the posture under attack (ADR-023 default) and the mode
          # the spec asserts against. Its own catalog file, not the smoke step's,
          # so a signed-up smoke user cannot perturb the seeded fixtures.
          TENANCY_MODE: per_tenant
          DATABASE_URL: file:ci-isolation.db
          RATE_LIMIT_ALLOW_IN_MEMORY: "true"
          STRIPE_SECRET_KEY: sk_test_ci-e2e-only-dummy-not-a-real-key
          STRIPE_WEBHOOK_SECRET: whsec_ci-e2e-only-dummy-not-a-real-secret
          # LAUNCHED — "live-quiet: any authenticated user passes"
          # (lib/live-eval.ts). Same reason as the two steps above: this drives
          # signed-in surfaces, and LIVE_EVAL would 403 every one of them.
          APP_LIFECYCLE_STATE: LAUNCHED
          EMAIL_PROVIDER_API_KEY: re_ci-e2e-only-dummy-not-a-real-key
          EMAIL_SEND_MODE: log
          # Blank on the template → spec self-skips. Two distinct file: URLs on a
          # generated app → the attack runs for real.
          TENANT_DB_URL_TENANT_A: ${{ github.repository != 'PiersAG/house-starter' && 'file:isolation-tenant-a.db' || '' }}
          TENANT_DB_URL_TENANT_B: ${{ github.repository != 'PiersAG/house-starter' && 'file:isolation-tenant-b.db' || '' }}
        run: |
          npx playwright install chromium
          npm run test:isolation

      # Fail on high-severity vulnerabilities in production dependencies.
      - name: Security audit
        run: npm audit --audit-level high --omit=dev

      # Anti-slopsquatting: for every dependency outside the pinned
      # house-starter baseline (scripts/deps-baseline.json), verify it exists
      # on the npm registry, the resolved version is >= 14 days old, and the
      # package is established (>= 90 days old or >= 1000 weekly downloads).
      # Also asserts the lockfile is in sync. Deterministic — no LLM, no
      # writes. Spec: wiki/specs/stage0-deps-and-budget.md.
      #
      # `if: always()` is load-bearing, not defensive. Steps are skipped once an
      # earlier one fails, and `Security audit` above has been failing on
      # pre-existing advisories in next / next-auth / postcss / sharp. That made
      # this step SKIP on every run, so the anti-slopsquatting gate — the one
      # control specifically aimed at a hallucinated or typosquatted package
      # entering the tree — was silently absent from CI while appearing in the
      # job list. Discovered closing card 2.3.3, restored by card 2.3.4.
      #
      # This runs the check independently of the audit's outcome. It does NOT
      # suppress the audit: that step still fails the job, because those
      # advisories are real and are reported as a finding, not hidden.
      - name: Dependency existence check (anti-slopsquatting)
        if: always()
        run: python3 scripts/check-deps-existence.py --workspace .

      # Socket supply-chain signal — ADVISORY ONLY, by CEO ruling. It reports;
      # it never fails the job and never blocks a merge. Both guards are
      # deliberate and both are needed:
      #   continue-on-error: true  — a Socket outage, quota exhaustion or API
      #                              change can never turn into a red build.
      #   if: always()             — it still runs when an earlier step failed,
      #                              which is the whole point of this card.
      # The script itself also exits 0 unconditionally, so this is non-blocking
      # in three independent ways. Making it blocking is a CEO decision, not a
      # config tweak.
      #
      # Self-skips when SOCKET_API_KEY is absent, exactly like the Stripe
      # test-clock step above, so the job is green with or without the secret.
      - name: Socket supply-chain report (advisory only, never blocks)
        if: always()
        continue-on-error: true
        env:
          SOCKET_API_KEY: ${{ secrets.SOCKET_API_KEY }}
        run: node scripts/socket-report.mjs

  # Both-states matrix (capability-model-spec R3): prove every capability flag is
  # a REAL switch by running the suite with it flipped OFF as well as ON, not
  # just at the default posture. Each leg is a fresh (throwaway) checkout;
  # scripts/set-flag.mjs rewrites config/capabilities.ts before the suite runs —
  # the sanctioned flip mechanism (never a runtime env var; see config/kernel.ts).
  #
  # SCOPE (explicit, not silent): each leg runs type-check + the unit suite,
  # which is where flag-driven behaviour (settings visibility, and — as
  # capabilities gain routes/nav in steps 1, 3–9 — their 404-when-off and
  # nav-absent proofs in tests/unit/capability-both-states.test.ts) is asserted.
  # The full e2e/Playwright + coverage + security gates run once, at the default
  # posture, in the `ci` job above; they are not re-run per leg to bound CI cost.
  # This job is the pattern later per-feature retrofits extend by adding routes
  # to CAPABILITY_ROUTES / CAPABILITY_NAV.
  capability-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flag: [payments, booking, comms]
        # Quoted: YAML 1.1 reads bare on/off as booleans, which would pass
        # "true"/"false" to set-flag.mjs (it wants on|off).
        state: ["on", "off"]
    name: capability ${{ matrix.flag }} = ${{ matrix.state }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Flip capability flag (throwaway checkout)
        run: node scripts/set-flag.mjs --flag ${{ matrix.flag }} --state ${{ matrix.state }}

      - name: Show resulting capability posture
        run: |
          echo "config/capabilities.ts posture for this leg:"
          grep -E "payments:|booking:|comms:" config/capabilities.ts

      - name: Type check (flag ${{ matrix.state }})
        run: npm run type-check

      - name: Unit suite (flag ${{ matrix.flag }} = ${{ matrix.state }})
        run: npm run test

  # Subscription-billing both-states matrix (capability-model-spec §2.1 · the
  # per-app ACTIVE switch). Separate from capability-matrix above because what is
  # being flipped is NOT a capability: `subscription_billing` is KERNEL and stays
  # built into every app in both legs. What varies is whether the app SELLS a
  # subscription — a per-app commission decision (Route B), carried by
  # config/billing.ts · subscriptionActive.
  #
  # WHY IT BLOCKS. The toggle-safety rule: "off" means present-but-provably-INERT
  # and TESTED. A no-subscription app still ships every billing route, so the
  # only thing standing between it and a live-but-unconfigured Stripe call is the
  # off leg of this job. tests/unit/billing-both-states.test.ts is posture-aware
  # and carries its own negative control, so the off leg fails if a billing route
  # were live — it is not a test that passes because nothing was checked.
  billing-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Quoted for the same reason as capability-matrix: YAML 1.1 reads bare
        # on/off as booleans, and set-flag.mjs wants the strings on|off.
        state: ["on", "off"]
    name: subscription_active = ${{ matrix.state }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Flip the per-app subscription switch (throwaway checkout)
        run: node scripts/set-flag.mjs --flag subscription_active --state ${{ matrix.state }}

      - name: Show resulting billing posture
        run: |
          echo "config/billing.ts posture for this leg:"
          grep -E "subscriptionActive:" config/billing.ts
          echo "config/kernel.ts (must stay ON in BOTH legs — the part is built in either way):"
          grep -E "subscription_billing:" config/kernel.ts

      - name: Type check (subscription_active ${{ matrix.state }})
        run: npm run type-check

      - name: Unit suite (subscription_active = ${{ matrix.state }})
        run: npm run test

      # The fail-closed price guard, run in the posture this leg represents. ON →
      # the template rule (the stub must still be there). OFF → the inverted
      # no-subscription rule (no real price may be present). Together these are
      # the "no fake price" half of the toggle-safety rule.
      - name: Billing price guard (posture-appropriate mode)
        run: |
          if [ "${{ github.repository }}" != "PiersAG/house-starter" ]; then
            echo "billing matrix guard: skipped outside template (real billing config asserted by the main ci job against unmutated config/billing.ts)"
            exit 0
          fi
          if [ "${{ matrix.state }}" = "off" ]; then
            node scripts/check-billing-configured.mjs
          else
            node scripts/check-billing-configured.mjs --expect-stub
          fi
