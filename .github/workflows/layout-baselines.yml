# Regenerate the layout guardrail's screenshot baselines — IN CI, WHERE THEY
# ARE COMPARED (card 2.3.51).
#
# This workflow exists because the baselines cannot be made anywhere else.
# Playwright 1.60 installs no browser on the dev machine (no Ubuntu 26.04
# support), and even where it could, a screenshot rendered against a different
# font stack differs from CI's by thousands of pixels — so a locally-generated
# baseline would fail every CI run after it. Generating them on the same runner
# image that compares them is the only arrangement that holds.
#
# ── WHEN TO RUN IT ─────────────────────────────────────────────────────────
#   • A branch added or renamed a guarded page or width, and CI is failing with
#     "A snapshot doesn't exist at ...".
#   • A layout change is INTENDED. The guardrail failing is the gate doing its
#     job; running this is how you say "yes, that is the new correct layout".
#   • Playwright or the runner image moved under us (a dependabot bump to
#     @playwright/test changes the browser build, and with it the rasterisation).
#
# ── HOW TO RUN IT: TWO TRIGGERS, AND WHY BOTH ARE NEEDED ───────────────────
#
#   1. workflow_dispatch — Actions → "Layout baselines" → Run workflow → pick
#      the branch → give a reason. The everyday path.
#
#        gh workflow run layout-baselines.yml --ref <branch> -f reason="<why>"
#
#      GitHub only offers this for workflows that exist on the DEFAULT BRANCH.
#      So it does nothing for the branch that INTRODUCES this file, or for any
#      branch cut before it merged — which is exactly when the first baselines
#      have to be made. Hence:
#
#   2. Push a change to tests/layout/BASELINES.request — a plain text file whose
#      contents are the reason. Works from any branch, including this one before
#      it merges, because a push trigger needs nothing on the default branch.
#      The file stays in the repo as the log of why each regeneration happened.
#
# Either way the PNGs are committed straight to the branch that was run, so the
# diff is reviewable in the PR like any other change. REVIEW THE IMAGE DIFF —
# an accepted baseline is an accepted layout.
#
# Do not run this against main to "fix" a red guardrail on main. A red guardrail
# on main is a regression that reached main; fix the layout, don't rebless the
# picture.

name: Layout baselines

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the baselines are being regenerated (goes in the commit message)"
        required: true
        type: string
  push:
    paths:
      - "tests/layout/BASELINES.request"

# Needed to push the regenerated PNGs back to the branch. Nothing else in this
# workflow writes anything.
permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Same env as the guardrail step in ci.yml — the baselines must be
      # rendered by the same app, in the same posture, that CI will compare them
      # against. CI-ONLY THROWAWAY VALUES; none of these reach a real system.
      # APP_LIFECYCLE_STATE=LAUNCHED for the same reason as there: the guarded
      # pages are behind sign-in, and LIVE_EVAL 403s a fresh CI user.
      #
      # continue-on-error is load-bearing, not defensive: `--update-snapshots`
      # WRITES the new baseline and still reports the test as failed when the
      # old one was missing or different. That is the expected outcome of a
      # regeneration run — the useful output is the PNGs, which the next step
      # commits. A genuine failure (the app won't boot, sign-in broke) surfaces
      # as "no baseline changes to commit" below, not as a silent green.
      - name: Regenerate baselines
        continue-on-error: true
        env:
          AUTH_SECRET: ci-e2e-only-dummy-secret-not-used-anywhere-real
          TENANCY_MODE: shared
          DATABASE_URL: file:ci-layout.db
          RATE_LIMIT_ALLOW_IN_MEMORY: "true"
          STRIPE_SECRET_KEY: sk_test_ci-e2e-only-dummy-not-a-real-key
          STRIPE_WEBHOOK_SECRET: whsec_ci-e2e-only-dummy-not-a-real-secret
          APP_LIFECYCLE_STATE: LAUNCHED
          EMAIL_PROVIDER_API_KEY: re_ci-e2e-only-dummy-not-a-real-key
          EMAIL_SEND_MODE: log
        run: |
          npx playwright install --with-deps chromium
          npm run test:layout:update

      - name: Commit the regenerated baselines
        env:
          REASON: ${{ inputs.reason || format('push to tests/layout/BASELINES.request ({0})', github.sha) }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/layout/__screenshots__
          if git diff --cached --quiet; then
            echo "::warning::No baseline changes to commit. Either the layout already matched every committed baseline, or the run never got as far as taking a screenshot — read the step above before assuming the former."
            exit 0
          fi
          git commit -m "test(layout): regenerate CI screenshot baselines" -m "Reason: ${REASON}" -m "Generated on the CI runner by .github/workflows/layout-baselines.yml, which is the only environment these may be generated in — see docs/layout-guardrail.md."
          git push origin HEAD:${{ github.ref_name }}
          echo "Baselines committed to ${{ github.ref_name }}."

      # The report carries the actual/expected/diff images, which is what makes
      # a regeneration reviewable when the change is not obvious from the PNGs.
      - name: Upload the regeneration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-baseline-regeneration-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
